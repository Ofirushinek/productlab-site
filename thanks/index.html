<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>אתם בפנים · Product Lab</title>
  <!-- Post-registration page: the register form (app.js wireRegister) lands
       here on success. Not linked from anywhere, never indexed. -->
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="../assets/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Same stylesheet as the site: tokens + .noacct__ico/.reg__success-* (the
       register form's own success view), .section-title, .btn — nothing new. -->
  <link rel="stylesheet" href="../styles.css?v=20261004h" />
  <style>
    /* Page-level layout only (one-moment screen: fits one viewport, no scroll).
       Everything visual comes from styles.css tokens/components above. */
    .thanks { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: var(--space-6) var(--pad-x); }
    .thanks__card { text-align: center; max-width: 34rem; }
    .thanks__card .section-title { max-width: none; margin-inline: auto; font-size: var(--text-h2); }
    .thanks__card .reg__success-body { margin-top: var(--space-3); }
    .thanks__card .cta-row { justify-content: center; margin-top: var(--space-5); }
  </style>
  <!-- Launch config: PIXEL_ID / PRICE_ILS — the SAME file index.html loads. -->
  <script src="../config.js?v=20261004d"></script>
</head>
<body>
<main class="thanks">
  <div class="thanks__card">
    <div class="noacct__ico reg__success-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
    <h1 class="section-title">אתם בפנים.</h1>
    <p class="reg__success-body">תודה. אחזור אליכם תוך 24 שעות לשיחה קצרה, נכיר ונוודא שהכול מותקן.</p>
    <div class="cta-row">
      <a class="btn btn--ghost" href="../">חזרה לאתר</a>
    </div>
  </div>
</main>
<script>
  /* Meta Pixel — PageView only (the `Lead` already fired on the form submit). */
  (function () {
    var cfg = window.PL_CONFIG || {};
    var id = cfg.PIXEL_ID || "";
    if (!id) return;
    if (location.hostname === "localhost" || location.hostname === "127.0.0.1") return;
    var n = (window.fbq = function () { n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments); });
    if (!window._fbq) window._fbq = n;
    n.push = n; n.loaded = true; n.version = "2.0"; n.queue = [];
    var sc = document.createElement("script"); sc.async = true; sc.src = "https://connect.facebook.net/en_US/fbevents.js";
    document.head.appendChild(sc);
    fbq("init", id);
    fbq("track", "PageView");
  })();
</script>
</body>
</html>
